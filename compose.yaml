name: secure-cloud-infrastructure-platform

x-api-environment: &api-environment
  SCIP_ENVIRONMENT: ${SCIP_ENVIRONMENT:-development}
  SCIP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  SCIP_JWT_SIGNING_KEY: ${SCIP_JWT_SIGNING_KEY:?set SCIP_JWT_SIGNING_KEY}
  SCIP_JWT_ISSUER: ${SCIP_JWT_ISSUER:-secure-cloud-infrastructure-platform}
  SCIP_JWT_AUDIENCE: ${SCIP_JWT_AUDIENCE:-secure-cloud-platform-api}
  SCIP_JWT_KEY_ID: ${SCIP_JWT_KEY_ID:-compose-hs256-v1}
  SCIP_ACCESS_TOKEN_TTL_SECONDS: ${SCIP_ACCESS_TOKEN_TTL_SECONDS:-900}
  SCIP_ALLOWED_HOSTS: ${SCIP_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
  SCIP_CORS_ORIGINS: ${SCIP_CORS_ORIGINS:-}
  SCIP_AUTO_CREATE_SCHEMA: "false"
  SCIP_DOCS_ENABLED: ${SCIP_DOCS_ENABLED:-true}
  SCIP_METRICS_ENABLED: "true"
  SCIP_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces

x-api-security: &api-security
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: runtime
    image: scip-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    <<: *api-security

  api:
    build:
      context: .
      target: runtime
    image: scip-api:local
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:8000:8000"
    networks: [edge, backend]
    restart: unless-stopped
    <<: *api-security

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [backend]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [backend]
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
