apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "scip.fullname" . }}-migrate
  labels:
    {{- include "scip.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "scip.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "scip.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: SCIP_ENVIRONMENT
              value: {{ .Values.config.environment | quote }}
            - name: SCIP_JWT_ISSUER
              value: {{ .Values.config.jwtIssuer | quote }}
            - name: SCIP_JWT_AUDIENCE
              value: {{ .Values.config.jwtAudience | quote }}
            - name: SCIP_JWT_KEY_ID
              value: {{ .Values.config.jwtKeyId | quote }}
            - name: SCIP_ACCESS_TOKEN_TTL_SECONDS
              value: {{ .Values.config.accessTokenTtlSeconds | quote }}
            - name: SCIP_ALLOWED_HOSTS
              value: {{ .Values.config.allowedHosts | quote }}
            - name: SCIP_AUTO_CREATE_SCHEMA
              value: "false"
          envFrom:
            - secretRef:
                name: {{ required "runtimeSecretName is required" .Values.runtimeSecretName }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
