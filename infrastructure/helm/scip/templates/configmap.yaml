apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scip.fullname" . }}
  labels:
    {{- include "scip.labels" . | nindent 4 }}
data:
  SCIP_ENVIRONMENT: {{ .Values.config.environment | quote }}
  SCIP_JWT_ISSUER: {{ .Values.config.jwtIssuer | quote }}
  SCIP_JWT_AUDIENCE: {{ .Values.config.jwtAudience | quote }}
  SCIP_JWT_KEY_ID: {{ .Values.config.jwtKeyId | quote }}
  SCIP_ACCESS_TOKEN_TTL_SECONDS: {{ .Values.config.accessTokenTtlSeconds | quote }}
  SCIP_ALLOWED_HOSTS: {{ .Values.config.allowedHosts | quote }}
  SCIP_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  SCIP_AUTO_CREATE_SCHEMA: "false"
  SCIP_DOCS_ENABLED: {{ .Values.config.docsEnabled | quote }}
  SCIP_METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  SCIP_OTLP_TRACES_ENDPOINT: {{ .Values.config.otlpTracesEndpoint | quote }}
