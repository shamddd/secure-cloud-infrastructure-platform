name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python quality gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_DB: scip_test
          POSTGRES_USER: scip
          POSTGRES_PASSWORD: integration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scip -d scip_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SCIP_TEST_POSTGRES_URL: postgresql+asyncpg://scip:integration-test-password@127.0.0.1:5432/scip_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.21
          uv sync --frozen --extra dev
      - name: Lint and format-check
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Audit source and dependencies
        run: |
          uv run bandit -q -r src
          uv export --frozen --no-dev --no-emit-project --format requirements-txt | uv run pip-audit --disable-pip -r /dev/stdin

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8
      - name: Validate Terraform
        working-directory: infrastructure/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install verified kubeconform
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          curl --fail --silent --show-error --location \
            --output /tmp/kubeconform-checksums.txt \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/CHECKSUMS
          expected=$(awk '/kubeconform-linux-amd64.tar.gz$/ {print $1}' /tmp/kubeconform-checksums.txt)
          actual=$(sha256sum /tmp/kubeconform.tar.gz | awk '{print $1}')
          test "$actual" = "$expected"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
      - name: Validate Helm chart
        run: |
          digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          helm lint infrastructure/helm/scip \
            --set image.repository=us-docker.pkg.dev/demo/platform/scip \
            --set image.digest="$digest"
          helm template scip infrastructure/helm/scip \
            --namespace scip \
            --set image.repository=us-docker.pkg.dev/demo/platform/scip \
            --set image.digest="$digest" \
            | /tmp/kubeconform -strict -summary -kubernetes-version 1.36.0

  container:
    name: Reproducible container build
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: scip
      POSTGRES_USER: scip
      POSTGRES_PASSWORD: compose-validation-password
      GRAFANA_ADMIN_PASSWORD: compose-validation-password
      SCIP_JWT_SIGNING_KEY: compose-validation-key-with-at-least-thirty-two-characters
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build runtime image
        run: docker build --tag scip-api:local .
      - name: Smoke-test containerized API
        run: |
          docker compose up --no-build --detach postgres otel-collector migrate api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api migrate postgres
          exit 1
      - name: Stop smoke-test services
        if: always()
        run: docker compose down --volumes
