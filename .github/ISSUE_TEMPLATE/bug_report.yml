name: Bug report
description: Report a reproducible defect without including secrets or personal data.
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste credentials, access tokens, private endpoints, or customer data.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who or what is affected?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction and expected behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include request IDs, logs, and versions after removing sensitive values.
